# AWS Amplify Hosting build spec for ClearTrial (Next.js 16, pnpm).
#
# Amplify auto-detects Next.js SSR. The /api/match route and /dashboard are
# server-rendered, so this deploys as a compute (SSR) app, not a static export.
#
# Secrets are configured in the Amplify console (App settings > Environment
# variables) and are never committed to this file, because this repo is
# public. Set these values there:
#   OPENAI_API_KEY      required for live OpenAI extraction; without it the
#                       app runs in offline fallback mode
#   BRIGHTDATA_API_KEY  optional; enables Web Unlocker for trial ingestion
#   BRIGHTDATA_ZONE     optional; defaults to web_unlocker1 in the script
#
# Trial data is committed at src/data/trials.json, so no network fetch runs
# during the build.
#
# Next.js SSR note: Amplify does not expose console env vars to server-side
# runtimes by default. The build command below copies the secrets from the
# build environment into .env.production so the deployed functions can read
# them. That file is written only in the build container and never committed.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify's default image may ship an older Node than Next 16 needs.
        - 'nvm install 22 && nvm use 22'
        - 'node --version'
        - 'corepack enable'
        - 'corepack prepare pnpm@10.6.2 --activate'
        - 'pnpm install --frozen-lockfile'
        - 'test -n "$OPENAI_API_KEY" && echo "env OPENAI_API_KEY: set" || echo "env OPENAI_API_KEY: missing (offline fallback mode)"'
        - 'test -n "$BRIGHTDATA_API_KEY" && echo "env BRIGHTDATA_API_KEY: set" || echo "env BRIGHTDATA_API_KEY: not set (direct ClinicalTrials.gov fallback)"'
    build:
      commands:
        - '(env | grep -e OPENAI_API_KEY -e BRIGHTDATA_API_KEY -e BRIGHTDATA_ZONE >> .env.production) || true'
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
